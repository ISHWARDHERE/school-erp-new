<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css?v=3.4"> </head>
<body>

<div class="dashboard-container">
    <div class="sidebar">
        <div class="logo-area">
            <i class="fa-solid fa-graduation-cap"></i>
            <h2>THE RISING STAR</h2>
        </div>
        
        <div class="nav-links">
            <a href="/admin_dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            
            <a href="/web_students" class="active"><i class="fa-solid fa-user-graduate"></i> Students</a>
            
            <a href="/web_teachers"><i class="fa-solid fa-chalkboard-user"></i> Teachers</a>
            <a href="/web_attendance"><i class="fa-regular fa-calendar-check"></i> Attendance</a>
            <a href="/web_fees"><i class="fa-solid fa-credit-card"></i> Fees</a>
            <a href="/web_results"><i class="fa-solid fa-square-poll-vertical"></i> Results</a>
            <a href="/web_homework"><i class="fa-solid fa-book-open"></i> Homework</a>
            <a href="/view_notices"><i class="fa-solid fa-bullhorn"></i> Notices</a>
            <a href="/admission_requests"><i class="fa-solid fa-user-plus"></i> Admission</a>
            <a href="/web_reports"><i class="fa-solid fa-chart-pie"></i> Reports</a>
            
            <a href="/logout" class="logout-link" style="margin-top: auto;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <h1>Edit Student Profile</h1>
            <div class="user-profile">
                <a href="/web_students" style="text-decoration: none; margin-right: 15px;">
                    <button class="btn-idcard" style="padding: 8px 14px; background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe;">
                        <i class="fa-solid fa-arrow-left"></i> Back to List
                    </button>
                </a>
                <div class="avatar">A</div>
            </div>
        </div>

        <div class="form-container" style="max-width: 650px; margin-top: 20px;">
            <div class="form-header">
                <h2><i class="fa-solid fa-user-pen" style="color: #2563eb;"></i> Modify Student Details</h2>
                <p>Update the student's personal or academic records. Make sure to double-check values before saving.</p>
            </div>

            <form action="/update_student_web/{{ student.id }}" method="post">

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label><i class="fa-solid fa-user"></i> Student Name</label>
                        <input type="text" name="student_name" value="{{ student.student_name }}" placeholder="Enter student name" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fa-solid fa-school"></i> Class Name</label>
                        <input type="text" name="class_name" value="{{ student.class_name }}" placeholder="e.g. 10th-B" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
                    <div class="form-group">
                        <label><i class="fa-solid fa-phone"></i> Mobile Number</label>
                        <input type="text" name="mobile" value="{{ student.mobile }}" placeholder="10-digit number" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fa-solid fa-indian-rupee-sign"></i> Yearly Fee</label>
                        <input type="text" name="yearly_fee" value="{{ student.yearly_fee }}" placeholder="Total annual fee" required>
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 25px;">
                    <button type="submit" class="btn-submit" style="width: 100%; justify-content: center; padding: 12px; background: #2563eb; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);">
                        <i class="fa-solid fa-check-double"></i> Update & Save Changes
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>

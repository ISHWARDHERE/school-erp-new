<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <!-- Google Fonts & FontAwesome for Premium Design -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css?v=2.4"> <!-- Cache Busting -->
</head>
<body>

{% if success %}
<script>
    alert("Student Saved Successfully");
</script>
{% endif %}

<div class="dashboard-container">
    <!-- SIDEBAR (ALL MODULES MATCHING WITH DASHBOARD) -->
    <div class="sidebar">
        <div class="logo-area">
            <i class="fa-solid fa-graduation-cap"></i>
            <h2>THE RISING STAR</h2>
        </div>
        
        <div class="nav-links">
            <a href="/admin_dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            
            <!-- Student Module Active ठेवून या अंतर्गत हे काम सुरू आहे -->
            <a href="/web_students" class="active"><i class="fa-solid fa-user-graduate"></i> Students</a>
            
            <a href="/web_teachers"><i class="fa-solid fa-chalkboard-user"></i> Teachers</a>
            <a href="/web_attendance"><i class="fa-regular fa-calendar-check"></i> Attendance</a>
            <a href="/web_fees"><i class="fa-solid fa-credit-card"></i> Fees</a>
            <a href="/web_result"><i class="fa-solid fa-square-poll-vertical"></i> Results</a>
            <a href="/add_homework"><i class="fa-solid fa-book-open"></i> Homework</a>
            <a href="/view_notices"><i class="fa-solid fa-bullhorn"></i> Notices</a>
            <a href="/admission_requests"><i class="fa-solid fa-user-plus"></i> Admission</a>
            <a href="/web_result_list"><i class="fa-solid fa-chart-pie"></i> Reports</a>
            
            <a href="/logout" class="logout-link" style="margin-top: auto;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="main">
        <div class="topbar">
            <h1>Add New Student</h1>
            <div class="user-profile">
                <!-- परत यादी पाहण्यासाठी क्विक लिंक बटण -->
                <a href="/web_students" style="text-decoration: none; margin-right: 15px;">
                    <button class="btn-idcard" style="padding: 8px 14px; background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe;">
                        <i class="fa-solid fa-list"></i> Student List
                    </button>
                </a>
                <div class="avatar">A</div>
            </div>
        </div>

        <!-- PREMIUM FORM CARD LAYOUT -->
        <div class="form-container" style="max-width: 650px; margin-top: 20px;">
            <div class="form-header">
                <h2><i class="fa-solid fa-user-plus" style="color: #2563eb;"></i> Student Admission Form</h2>
                <p>Fill in the registration details below to clear official admission.</p>
            </div>

            <form action="/save_student_web"
                  method="post"
                  enctype="multipart/form-data"
                  onsubmit="return validateForm()">

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <!-- Admission Number -->
                    <div class="form-group">
                        <label><i class="fa-solid fa-hashtag"></i> Admission Number</label>
                        <input type="text" name="admission_no" placeholder="e.g. TR001" required>
                    </div>

                    <!-- Student Name -->
                    <div class="form-group">
                        <label><i class="fa-solid fa-user"></i> Student Full Name</label>
                        <input type="text" name="student_name" placeholder="Enter full name" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px;">
                    <!-- Class Name -->
                    <div class="form-group">
                        <label><i class="fa-solid fa-school"></i> Class Name</label>
                        <input type="text" name="class_name" placeholder="e.g. 10th-A" required>
                    </div>

                    <!-- Father Name -->
                    <div class="form-group">
                        <label><i class="fa-solid fa-person-breastfeeding"></i> Father Name</label>
                        <input type="text" name="father_name" placeholder="Enter father name" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px;">
                    <!-- Mobile Number -->
                    <div class="form-group">
                        <label><i class="fa-solid fa-phone"></i> Mobile Number</label>
                        <input type="text" name="mobile" placeholder="10-digit number" required>
                    </div>

                    <!-- Photo Upload -->
                    <div class="form-group">
                        <label><i class="fa-solid fa-image"></i> Student Photo</label>
                        <input type="file" name="photo" style="padding: 8px;" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px;">
                    <!-- Yearly Fee -->
                    <div class="form-group">
                        <label><i class="fa-solid fa-indian-rupee-sign"></i> Yearly Fee</label>
                        <input type="number" name="yearly_fee" placeholder="Total standard fee" required>
                    </div>

                    <!-- Discount -->
                    <div class="form-group">
                        <label><i class="fa-solid fa-tags"></i> Discount Given</label>
                        <input type="number" name="discount" placeholder="Discount if any" required>
                    </div>
                </div>

                <!-- Submit Button Area -->
                <div class="form-actions" style="margin-top: 25px;">
                    <button type="submit" class="btn-submit" style="width: 100%; justify-content: center; padding: 12px;">
                        <i class="fa-solid fa-floppy-disk"></i> Register & Save Student
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- FORM VALIDATION SCRIPT -->
<script>
function validateForm() {
    let student_name = document.getElementsByName("student_name")[0].value;
    let class_name = document.getElementsByName("class_name")[0].value;
    let mobile = document.getElementsByName("mobile")[0].value;
    let yearly_fee = document.getElementsByName("yearly_fee")[0].value;

    if (student_name == "" || class_name == "" || mobile == "" || yearly_fee == "") {
        alert("Please fill all fields");
        return false;
    }
    return true;
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Add Homework</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css?v=3.2"> </head>
<body>

<div class="dashboard-container">
    <div class="sidebar">
        <div class="logo-area">
            <i class="fa-solid fa-graduation-cap"></i>
            <h2>THE RISING STAR</h2>
        </div>
        
        <div class="nav-links">
            {% if request.session.role == "admin" %}
                <a href="/admin_dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            {% else %}
                <a href="/teacher_dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            {% endif %}
            
            <a href="/web_students"><i class="fa-solid fa-user-graduate"></i> Students</a>
            <a href="/web_teachers"><i class="fa-solid fa-chalkboard-user"></i> Teachers</a>
            <a href="/web_attendance"><i class="fa-regular fa-calendar-check"></i> Attendance</a>
            <a href="/web_fees"><i class="fa-solid fa-credit-card"></i> Fees</a>
            <a href="/web_result_list"><i class="fa-solid fa-square-poll-vertical"></i> Results</a>
            
            <a href="/add_homework" class="active"><i class="fa-solid fa-book-open"></i> Homework</a>
            
            <a href="/view_notices"><i class="fa-solid fa-bullhorn"></i> Notices</a>
            <a href="/admission_requests"><i class="fa-solid fa-user-plus"></i> Admission</a>
            <a href="/web_reports"><i class="fa-solid fa-chart-pie"></i> Reports</a>
            
            <a href="/logout" class="logout-link" style="margin-top: auto;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <h1>Add Homework</h1>
            <div class="user-profile">
                <a href="/web_homework_list" style="text-decoration: none; margin-right: 15px;">
                    <button class="btn-idcard" style="padding: 8px 14px; background: #fef3c7; color: #d97706; border: 1px solid #fde68a;">
                        <i class="fa-solid fa-list-check"></i> Homework List
                    </button>
                </a>
                <div class="avatar">A</div>
            </div>
        </div>

        <div class="form-container" style="max-width: 650px; margin-top: 20px;">
            <div class="form-header">
                <h2><i class="fa-solid fa-book-bookmark" style="color: #3b82f6;"></i> Create Daily Homework</h2>
                <p>Select class, enter subject and write down the assignments for students.</p>
            </div>

            <form action="/save_homework" method="post">

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label><i class="fa-solid fa-school"></i> Class Name</label>
                        <select name="class_name" required>
                            <option value="" disabled selected>-- Select Class --</option>
                            <option>Nursery</option>
                            <option>LKG</option>
                            <option>UKG</option>
                            <option>1st</option>
                            <option>2nd</option>
                            <option>3rd</option>
                            <option>4th</option>
                            <option>5th</option>
                            <option>6th</option>
                            <option>7th</option>
                            <option>8th</option>
                            <option>9th</option>
                            <option>10th</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label><i class="fa-solid fa-book"></i> Subject</label>
                        <input type="text" name="subject" placeholder="e.g. Marathi, English" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 15px;">
                    <div class="form-group">
                        <label><i class="fa-solid fa-pen-to-square"></i> Homework Details (गृहपाठ मजकूर)</label>
                        <textarea name="homework_text" rows="5" placeholder="Type homework description or chapter questions here..." required style="width: 100%; font-family: inherit; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; resize: vertical;"></textarea>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
                    <div class="form-group">
                        <label><i class="fa-regular fa-calendar-days"></i> Assignment Date</label>
                        <input type="date" name="homework_date" required>
                    </div>
                    
                    <div class="form-group" style="visibility: hidden;">
                        <label>Hidden</label>
                        <input type="text">
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 25px;">
                    <button type="submit" class="btn-submit" style="width: 100%; justify-content: center; padding: 12px; background: #2563eb; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);">
                        <i class="fa-solid fa-paper-plane"></i> Save & Assign Homework
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
